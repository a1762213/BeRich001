name: binance-copy-monitor
on:
  schedule:
    - cron: "0 * * * *"   # 兜底(GitHub 自带定时不可靠, 主力是外部 cron-job.org 触发)
  repository_dispatch:
    types: [ping]            # 外部定时服务触发入口
  workflow_dispatch:          # 手动触发
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: true    # 新触发到达时取消排队/运行中的旧任务, 防止堆积
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 连续轮询 240 秒(每 30 秒一次), 由外部 5 分钟定时接力
      - name: monitor (30s polling for 4 min)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python binance_lead_monitor.py --loop 30 --duration 240
      # 把状态提交回仓库, 供下一次接力(与其他推送撞车时自动合并, 失败不标红)
      - name: commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state [skip ci]" || echo "no state change"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped (race with other run)"
