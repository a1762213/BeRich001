name: binance-copy-monitor
on:
  schedule:
    - cron: "*/5 * * * *"   # 每5分钟接力一次
  workflow_dispatch:          # 允许手动触发
permissions:
  contents: write             # 需要提交 state.json
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 连续轮询 240 秒(每 30 秒一次), 到时退出, 由下一个定时任务接力
      - name: monitor (30s polling for 4 min)
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: python binance_lead_monitor.py --loop 30 --duration 240
      # 把状态提交回仓库, 供下一次接力(与其他推送撞车时自动合并, 失败不标红)
      - name: commit state
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git commit -m "update state [skip ci]" || echo "no state change"
          git pull --rebase --autostash origin main || true
          git push || echo "push skipped (race with other run)"
